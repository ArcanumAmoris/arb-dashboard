# Scans every 10 minutes. GitHub's scheduler is unreliable for frequent jobs, so each
# run loops (scan → alerts → publish, every 10 min) for ~55 minutes, and the next run
# queues behind it. A push that changes the scanner or config also triggers a scan.
# The dashboard always shows the true data age.
name: Scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "config/**"
      - "docs/lib/**"
      - ".github/workflows/scan.yml"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Scan every 10 minutes for ~55 minutes
        env:
          LOOP_MINUTES: "55"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: bash scanner/loop.sh
